services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/lhccpdf
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - CLIENT_ORIGIN=https://lhccpdf.lakshmihealthcarecentrerockfort.com
    volumes:
      - uploads:/app/server/uploads

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    # HTTP only, bound to loopback. Host-level nginx terminates TLS and
    # proxies 443 -> 127.0.0.1:8081 (container port 80).
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
    external: true
    name: siddha-clinic-pdf-generator_mongodb_data
  uploads:
    external: true
    name: siddha-clinic-pdf-generator_uploads
